version: '3.8'

services:
  velas-lunas-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: tres-lunas-velas-app:v1.0.0
    container_name: tres_lunas_container
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
